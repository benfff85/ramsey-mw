services:
  db:
    image: mysql:latest
    container_name: ramsey-db-mysql
    networks:
      - ramsey-net
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: <password>
    volumes:
      - ./config-file.cnf:/etc/mysql/conf.d/config-file.cnf
    restart: on-failure

networks:
  ramsey-net:
    driver: bridge
    name: ramsey-net