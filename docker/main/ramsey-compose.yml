name: ramsey

services:

  redis:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    command: dragonfly --maxmemory 7gb --snapshot_cron "*/5 * * * *" --dbfilename dump --dir /data
    networks:
      - ramsey-net
    ports:
      - "36002:6379"
    volumes:
      - dragonfly-data:/data
    mem_limit: 8g
    scale: 1
    restart: unless-stopped
    logging:
      driver: loki
      options:
        loki-url: "https://loki.setminusx.cloud/loki/api/v1/push"
        mode: non-blocking
        max-buffer-size: 4m
        loki-retries: 5
        loki-batch-size: 1000
        loki-external-labels: "machine=MacBook-Pro-M4Max-1,service_name={{.Name}}"

  ramsey-mw:
    image: benferenchak/ramsey-mw:develop
    networks:
      - ramsey-net
    ports:
      - "36000:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_USER: ramsey-user-dev
      DB_PASS: ${MYSQL_PASSWORD}
      JDBC_BATCH_SIZE: 5000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOGGING_LEVEL_ROOT: INFO
    depends_on:
      - redis
    logging:
      driver: loki
      options:
        loki-url: "https://loki.setminusx.cloud/loki/api/v1/push"
        mode: non-blocking
        max-buffer-size: 4m
        loki-retries: 5
        loki-batch-size: 1000
        loki-external-labels: "machine=MacBook-Pro-M4Max-1,service_name={{.Name}}"
    restart: unless-stopped
    mem_limit: 8g
    scale: 1

  ramsey-queue-manager:
    image: benferenchak/ramsey-queue-manager:develop
    networks:
      - ramsey-net
    environment:
      SPRING_PROFILES_ACTIVE: dev
      RAMSEY_CAMPAIGN_ID: 10
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WORK_UNIT_ANALYSIS_TYPE: TARGETED
      WORK_ENUMERATION_STRATEGY: "DUAL_EDGE_CARDINALITY_WITH_SINGLES"  # singles census (majority color) + counter-based pair sweep
      TOP_RESULTS_COUNT: 50
      EXHAUSTION_DELAY_MS: 60000
      CYCLE_PREVENTION_GRAPH_LOOKBACK_COUNT: 5000
      STAGE_PROGRESSION_FREQUENCY_MS: 1000
      IMMEDIATELY_PROGRESS_STAGE_ON_IMPROVEMENT: "true"
      LOGGING_LEVEL_ROOT: INFO
    depends_on:
      - ramsey-mw
      - redis
    logging:
      driver: loki
      options:
        loki-url: "https://loki.setminusx.cloud/loki/api/v1/push"
        mode: non-blocking
        max-buffer-size: 4m
        loki-retries: 5
        loki-batch-size: 1000
        loki-external-labels: "machine=MacBook-Pro-M4Max-1,service_name={{.Name}}"
    restart: unless-stopped
    mem_limit: 2g
    scale: 1

  # Second QM: drives the current multi-seed campaign (rotations flip only its
  # RAMSEY_CAMPAIGN_ID) while the original QM keeps campaign 10 progressing for
  # the remote-machine workers. Safe to run two: all QM state is campaign-scoped;
  # processed_graph_hashes is a shared add-only set.
  ramsey-queue-manager-mseed:
    image: benferenchak/ramsey-queue-manager:develop
    networks:
      - ramsey-net
    environment:
      SPRING_PROFILES_ACTIVE: dev
      RAMSEY_CAMPAIGN_ID: 14
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WORK_UNIT_ANALYSIS_TYPE: TARGETED
      WORK_ENUMERATION_STRATEGY: "DUAL_EDGE_CARDINALITY_WITH_SINGLES"  # singles census (majority color) + counter-based pair sweep
      TOP_RESULTS_COUNT: 50
      EXHAUSTION_DELAY_MS: 60000
      CYCLE_PREVENTION_GRAPH_LOOKBACK_COUNT: 5000
      STAGE_PROGRESSION_FREQUENCY_MS: 1000
      IMMEDIATELY_PROGRESS_STAGE_ON_IMPROVEMENT: "true"
      LOGGING_LEVEL_ROOT: INFO
    depends_on:
      - ramsey-mw
      - redis
    logging:
      driver: loki
      options:
        loki-url: "https://loki.setminusx.cloud/loki/api/v1/push"
        mode: non-blocking
        max-buffer-size: 4m
        loki-retries: 5
        loki-batch-size: 1000
        loki-external-labels: "machine=MacBook-Pro-M4Max-1,service_name={{.Name}}"
    restart: unless-stopped
    mem_limit: 2g
    scale: 1

  ramsey-worker-rust:
    image: benferenchak/ramsey-worker-rust:develop
    networks:
      - ramsey-net
    environment:
      RAMSEY_API_URL: http://ramsey-mw:8080/api/ramsey
      RAMSEY_CAMPAIGN_ID: 14  # multi-seed basin program, rotation 4 (campaign 10 stays live for remote workers)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WORK_UNIT_FETCH_COUNT: 250000
      WORK_UNIT_PUBLISH_COUNT: 10000
      WORK_UNIT_POLL_FREQ: 5000
      PUBLISH_RESULTS: "false"
      TOP_RESULTS_COUNT: 50
      WORKER_COUNT: 1
    depends_on:
      ramsey-mw:
        condition: service_healthy
      redis:
        condition: service_started
    logging:
      driver: loki
      options:
        loki-url: "https://loki.setminusx.cloud/loki/api/v1/push"
        mode: non-blocking
        max-buffer-size: 4m
        loki-retries: 5
        loki-batch-size: 1000
        loki-external-labels: "machine=MacBook-Pro-M4Max-1,service_name={{.Name}}"
    restart: unless-stopped
    mem_limit: 2g
    scale: 14

  ramsey-worker-rust-sa:
    image: benferenchak/ramsey-worker-rust:develop
    networks:
      - ramsey-net
    environment:
      RAMSEY_API_URL: http://ramsey-mw:8080/api/ramsey
      RAMSEY_CAMPAIGN_ID: 10
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WORKER_MODE: SIMULATED_ANNEALING
      SA_MAX_ITERATIONS: 15000
      SA_INITIAL_TEMP: 1000.0
      SA_COOLING_RATE: 0.999
      SA_MIN_PAIRS: 2
      SA_MAX_PAIRS: 2
      TOP_RESULTS_COUNT: 50
      WORKER_COUNT: 1
    depends_on:
      ramsey-mw:
        condition: service_healthy
      redis:
        condition: service_started
    logging:
      driver: loki
      options:
        loki-url: "https://loki.setminusx.cloud/loki/api/v1/push"
        mode: non-blocking
        max-buffer-size: 4m
        loki-retries: 5
        loki-batch-size: 1000
        loki-external-labels: "machine=MacBook-Pro-M4Max-1,service_name={{.Name}}"
    restart: unless-stopped
    mem_limit: 2g
    scale: 0

  ramsey-worker-rust-vds:
    image: benferenchak/ramsey-worker-rust:develop
    networks:
      - ramsey-net
    environment:
      RAMSEY_API_URL: http://ramsey-mw:8080/api/ramsey
      RAMSEY_CAMPAIGN_ID: 10
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WORKER_MODE: VARIABLE_DEPTH_SEARCH
      VDS_MAX_DEPTH: 12
      VDS_TOP_FIRST_EDGES: 80
      VDS_BRANCHING_FACTOR: 12
      VDS_WORSENING_TOLERANCE: 500
      VDS_START_DEPTH: 3
      TOP_RESULTS_COUNT: 50
      WORKER_COUNT: 1
    depends_on:
      ramsey-mw:
        condition: service_healthy
      redis:
        condition: service_started
    logging:
      driver: loki
      options:
        loki-url: "https://loki.setminusx.cloud/loki/api/v1/push"
        mode: non-blocking
        max-buffer-size: 4m
        loki-retries: 5
        loki-batch-size: 1000
        loki-external-labels: "machine=MacBook-Pro-M4Max-1,service_name={{.Name}}"
    restart: unless-stopped
    mem_limit: 2g
    scale: 0

  ramsey-worker-rust-tabu:
    image: benferenchak/ramsey-worker-rust:develop
    networks:
      - ramsey-net
    environment:
      RAMSEY_API_URL: http://ramsey-mw:8080/api/ramsey
      RAMSEY_CAMPAIGN_ID: 10
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WORKER_MODE: TABU_CLIQUE_GUIDED
      TABU_MAX_ITERATIONS: 5000
      TABU_BASE_TENURE: 30
      TABU_MAX_TENURE: 60
      TABU_RESTART_AFTER: 1000
      TABU_CANDIDATE_POOL_SIZE: 10
      TABU_DIVERSIFICATION_PAIRS: 20
      TOP_RESULTS_COUNT: 50
      WORKER_COUNT: 1
    depends_on:
      ramsey-mw:
        condition: service_healthy
      redis:
        condition: service_started
    logging:
      driver: loki
      options:
        loki-url: "https://loki.setminusx.cloud/loki/api/v1/push"
        mode: non-blocking
        max-buffer-size: 4m
        loki-retries: 5
        loki-batch-size: 1000
        loki-external-labels: "machine=MacBook-Pro-M4Max-1,service_name={{.Name}}"
    restart: unless-stopped
    mem_limit: 2g
    scale: 0

  ramsey-ui:
    image: benferenchak/ramsey-ui:develop
    networks:
      - ramsey-net
    ports:
      - "36003:8501"
    environment:
      API_BASE_URL: http://ramsey-mw:8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      ramsey-mw:
        condition: service_healthy
    logging:
      driver: loki
      options:
        loki-url: "https://loki.setminusx.cloud/loki/api/v1/push"
        mode: non-blocking
        max-buffer-size: 4m
        loki-retries: 5
        loki-batch-size: 1000
        loki-external-labels: "machine=MacBook-Pro-M4Max-1,service_name={{.Name}}"
    restart: unless-stopped
    mem_limit: 2g
    scale: 1

networks:
  ramsey-net:
    external: true

volumes:
  dragonfly-data: