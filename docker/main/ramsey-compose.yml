      REDIS_HOST: redis
      REDIS_PORT: 6379
      WORKER_MODE: VARIABLE_DEPTH_SEARCH
      VDS_MAX_DEPTH: 12
      VDS_TOP_FIRST_EDGES: 80
      VDS_BRANCHING_FACTOR: 12
      VDS_WORSENING_TOLERANCE: 500
      VDS_START_DEPTH: 3
      TOP_RESULTS_COUNT: 50
      WORKER_COUNT: 1
    depends_on:
      ramsey-mw:
        condition: service_healthy
      redis:
