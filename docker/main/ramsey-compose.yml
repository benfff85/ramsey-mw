name: ramsey

services:

  redis:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    command: dragonfly --maxmemory 7gb --snapshot_cron "*/5 * * * *" --dbfilename dump --dir /data
    networks:
      - ramsey-net
    ports:
      - "36002:6379"
    volumes:
      - dragonfly-data:/data
    mem_limit: 8g
    scale: 1
    restart: unless-stopped
    logging:
      driver: loki
      options:
        loki-url: "https://loki.setminusx.cloud/loki/api/v1/push"
        mode: non-blocking
        max-buffer-size: 4m
        loki-retries: 5
        loki-batch-size: 1000
        loki-external-labels: "machine=MacBook-Pro-M4Max-1,service_name={{.Name}}"

  ramsey-mw:
    image: benferenchak/ramsey-mw:develop
    networks:
      - ramsey-net
    ports:
      - "36000:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_USER: ramsey-user-dev
      # Fail the deploy rather than start a middleware that cannot authenticate to MySQL. Unset,
      # this silently resolved to "" and recreated the container into a crash loop — which stops
      # the whole search, since workers get their stage from here.
      DB_PASS: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD before deploying (see database/README.md)}
      JDBC_BATCH_SIZE: 5000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOGGING_LEVEL_ROOT: INFO
      # Per-request timing logs at INFO only at/above this many ms (or on non-2xx). Workers poll
      # the fleet active-stage endpoint every cycle; logging each one was ~73 lines/sec.
      REQUEST_LOG_SLOW_MS: 250
    depends_on:
      - redis
    logging:
      driver: loki
      options:
        loki-url: "https://loki.setminusx.cloud/loki/api/v1/push"
        mode: non-blocking
        max-buffer-size: 4m
        loki-retries: 5
        loki-batch-size: 1000
        loki-external-labels: "machine=MacBook-Pro-M4Max-1,service_name={{.Name}}"
    restart: unless-stopped
    mem_limit: 8g
    scale: 1

  ramsey-queue-manager:
    image: benferenchak/ramsey-queue-manager:develop
    networks:
      - ramsey-net
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # Fleet abstraction: single campaign-agnostic QM — no RAMSEY_CAMPAIGN_ID.
      # It manages progression for EVERY campaign with an ACTIVE stage. The old
      # second QM (ramsey-queue-manager-mseed) is retired.
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WORK_UNIT_ANALYSIS_TYPE: TARGETED
      # Singles census + counter-based pair sweep, in plain edge order. The cardinality ordering
      # this replaces cost 13.5ms per stage per worker to build and existed to sweep likely
      # improvements first — which mattered when a sweep took ~233s and a stage only ever saw part
      # of its space. A sweep is now ~6s, stages routinely reach most of it, and the QM adopts the
      # best of the top-50 rather than the first found, so the order no longer changes the outcome.
      WORK_ENUMERATION_STRATEGY: "SEQUENTIAL_WITH_SINGLES"
      TOP_RESULTS_COUNT: 50
      # A/B history. 100 -> 50 was tried 2026-07-28 and was CATASTROPHIC, not merely slower: the
      # descent flatlined at ~836K after 80 min where the 100ms baseline reached its 25,721 floor in
      # 43. Weaker steps did not just cost rate, they changed the TRAJECTORY into a basin the search
      # could not leave -- and micro-improvements there kept resetting PERTURBATION_BASIN_STALE_STAGES,
      # so no kick fired to rescue it either. That says the settle window is doing real selection
      # work, not adding latency, which makes LENGTHENING it the interesting direction. Now testing
      # 200. Judge on FLOOR REACHED per kick cycle, never on stage rate -- stage rate moves the wrong
      # way for the right reason here.
      STAGE_ADOPT_SETTLE_MS: 200      # pub/sub-armed settle window; 0 = pure polling
      # Grace period for in-flight workers once a stage's work is fully CLAIMED but not yet fully
      # reported. A full sweep now takes seconds rather than minutes, so 15s was comparable to a
      # whole stage; 3s still comfortably covers a worker finishing its current batch (~0.2s
      # hoisted, ~1s unhoisted).
      EXHAUSTION_DELAY_MS: 3000
      CYCLE_PREVENTION_GRAPH_LOOKBACK_COUNT: 5000
      # A/B'd 1000 -> 100 on 2026-08-23: NULL (-1.3 sigma on throughput, idle unchanged) -- but the
      # CONCLUSION drawn from that ("exhaustion detection is not the source of the idle") was WRONG.
      # Polling 10x more often recovers the latency AND spends CPU on a box already saturated by 14
      # workers; the A/B could only show the net. Exhaustion detection WAS ~11.6% of wall-clock:
      # 66% of exhausted stages ended within 100ms of a whole second (flat = 20%). Fixed properly on
      # 2026-08-24 by the stage_exhausted_events channel, which gets the latency back without the
      # polling cost -- so this stays at 1000 and is now only a fallback. See
      # docs/investigations/post-hoist-bottleneck-review.md Part 4.
      STAGE_PROGRESSION_FREQUENCY_MS: 1000
      IMMEDIATELY_PROGRESS_STAGE_ON_IMPROVEMENT: "true"
      # Phase 2 perturbation (ILS kick): when the current basin has gone this many
      # stages without beating its OWN floor, restart from a kick of the campaign's
      # incumbent-best graph. The clock runs from the basin floor, not from the kick,
      # so a descent still finding new minima is never cut off (the old fixed
      # stages-since-kick wall killed kicks 18/19/20 mid-free-fall).
      PERTURBATION_ENABLED: "true"
      # Replaying campaign 10's basins, the gap between successive NEW basin minima reaches 249
      # stages near the floor — a basin goes quiet and then improves again. At 100 roughly half of
      # them would be kicked before reaching the floor they actually had; 500 cleared every gap
      # observed, trading kick frequency for basin depth.
      #
      # 500 -> 1000 (2026-07-29), buying more depth still. Backtested over campaign 10's 71 kicks:
      # healthy basins run 4,800-8,700 stages before flooring, so they were already sailing past a
      # 500-stage window on genuine new minima; doubling it costs few kicks and gives a slow basin
      # more room. KNOWN TRADEOFF: 4 of those 71 basins (5.6%) stalled >10x above the incumbent
      # while STILL setting tiny new floors, which resets this clock -- one burned 18,412 stages
      # (~15h) at 30.6x the incumbent before firing. Raising the window lengthens that tail. The
      # real fix is an incumbent-RELATIVE guard (kick if the basin cannot get within Nx of the
      # incumbent), not a bigger absolute count; see docs/investigations/post-hoist-bottleneck-review.md.
      #
      # 1000 -> 50000 (2026-08-08, Ben's call). ILS is deliberately parked: at 50k stages the
      # staleness clock will effectively never fire, so the fleet grinds plain descent with no kicks.
      # Rationale: the kick MAGNITUDE axis was exhausted on campaign 10 (31 kicks / 379k stages, zero
      # improvement on 25,604) and the whole Paley+1 line is now closed
      # (docs/investigations/frozen-paley-core-investigation.md), so the fleet is holding on
      # campaign 3 as a benchmark while a new direction is chosen. Restore to 1000 before any
      # campaign where ILS is meant to do real work.
      PERTURBATION_BASIN_STALE_STAGES: 50000
      PERTURBATION_EDGE_PAIRS: 60          # base kick; geometric escalation doubles: 60,120,240,480,960,1920
      # 32 -> 64 (2026-07-29) on the reasoning that every recent kick was already pinned at x32.
      # REVERTED to 32 on 2026-07-31: pinning was the SYMPTOM of kicks not working, not evidence that
      # a bigger one would help. Measured over campaign 10's 22 kicks, outcome is bimodal -- an epoch
      # either returns to ~1.0x the incumbent or strands on the ~785K shelf, nothing in between:
      #
      #   1920 pairs (x32):  16 kicks, 15 recovered (floors 25,705-25,796 in ~5-9k stages), 1 stranded
      #   3840 pairs (x64):   5 kicks,  0 recovered, all stranded at 30-53x for 17-27k stages
      #
      # A 3840-pair kick peaks at ~4.6M, which is essentially a random 282-coloring (expectation
      # ~6.7M) -- it discards the incumbent rather than perturbing it, and the descent then finds the
      # generic shelf any random start finds. Stranded epochs burned 110,433 of the ~215,000 stages
      # since kicks began (51% of fleet output); dropping the x64 tier removes ~100k of that.
      #
      # NOTE the staleness clock is NOT at fault here and needs no change: trailing stalls measured
      # 1,019 / 1,004 / 796 / 1,017 stages, so every stranded epoch went properly stale and kicked on
      # schedule. The descent to the shelf is 16-26k stages of GENUINE new minima, so basin staleness
      # cannot detect doom early -- a doomed and a healthy descent look identical to it. Only an
      # incumbent-RELATIVE test separates them, and it is thinner than it sounds: a HEALTHY basin sits
      # at 64-68x the incumbent at stage 500 and 51-61x at stage 1000 (the drop to 1.0x comes late),
      # versus 68.3-80.1x for stranded. That leaves a ~12% margin at stage 1000 on n=15/6 -- too thin
      # to trust, and it would only catch the 1-in-16 x32 case now that x64 is gone. Deliberately NOT
      # built; see docs/investigations/post-hoist-bottleneck-review.md.
      PERTURBATION_ESCALATION_CAP: 32      # max multiplier (x32) -> 6 steps: 60,120,240,480,960,1920
      PERTURBATION_CHECK_FREQUENCY_MS: 60000
      LOGGING_LEVEL_ROOT: INFO
    depends_on:
      - ramsey-mw
      - redis
    logging:
      driver: loki
      options:
        loki-url: "https://loki.setminusx.cloud/loki/api/v1/push"
        mode: non-blocking
        max-buffer-size: 4m
        loki-retries: 5
        loki-batch-size: 1000
        loki-external-labels: "machine=MacBook-Pro-M4Max-1,service_name={{.Name}}"
    restart: unless-stopped
    mem_limit: 2g
    scale: 1

  ramsey-worker-rust:
    image: benferenchak/ramsey-worker-rust:develop
    networks:
      - ramsey-net
    environment:
      RAMSEY_API_URL: http://ramsey-mw:8080/api/ramsey
      RAMSEY_FLEET: m4-max  # fleet abstraction: target set in the DB `fleet` table (repoint via PUT /fleets/m4-max, no redeploy)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # STARTING/MINIMUM batch — a FLOOR, not a size. It must be low enough that the worker can
      # size a batch to fit INSIDE a stage: during a descent stages last ~370ms and units cost
      # ~40us, so the controller wants ~5,000 units, and a floor of 25,000 pinned batches at ~1s
      # spanning 2.7 stages — every one abandoned partway once workers started reacting to stage
      # advances. In the wall the controller grows to ~740k regardless, so a low floor costs
      # nothing there.
      # The worker retunes it each cycle from measured throughput,
      # targeting ~200ms of work per cycle (see next_fetch_size): it grows toward ~800k once the
      # hoisted path engages (~0.26us/unit, amortising the ~22ms fixed per-cycle cost of the fleet
      # active-stage call plus three Redis round trips) and falls back here while unhoisted
      # (~4us/unit — every stage's warmup, and all of a fast post-kick descent), where a small
      # batch is what keeps a worker responsive to stage changes.
      WORK_UNIT_FETCH_COUNT: 2000
      WORK_UNIT_PUBLISH_COUNT: 10000
      WORK_UNIT_POLL_FREQ: 1000
      PUBLISH_RESULTS: "false"
      # Kill switch for the hoisted pair-move evaluation. The hoisted and seeded paths compute
      # identical values, so this only ever trades cost — set false to fall back to the kernel.
      HOIST_ENABLED: "true"
      TOP_RESULTS_COUNT: 50
      WORKER_COUNT: 1
      # Per-stage and per-batch tracing. Off by default: 14 workers each narrating every stage
      # transition is ~56 lines per stage, which at the post-hoist stage rate buried the events
      # worth reading. Set true on a single worker to get that detail back for debugging.
      RAMSEY_LOG_DEBUG: "false"
    depends_on:
      ramsey-mw:
        condition: service_healthy
      redis:
        condition: service_started
    logging:
      driver: loki
      options:
        loki-url: "https://loki.setminusx.cloud/loki/api/v1/push"
        mode: non-blocking
        max-buffer-size: 4m
        loki-retries: 5
        loki-batch-size: 1000
        loki-external-labels: "machine=MacBook-Pro-M4Max-1,service_name={{.Name}}"
    restart: unless-stopped
    mem_limit: 2g
    scale: 14

  ramsey-worker-rust-sa:
    image: benferenchak/ramsey-worker-rust:develop
    networks:
      - ramsey-net
    environment:
      RAMSEY_API_URL: http://ramsey-mw:8080/api/ramsey
      RAMSEY_CAMPAIGN_ID: 10
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WORKER_MODE: SIMULATED_ANNEALING
      SA_MAX_ITERATIONS: 15000
      SA_INITIAL_TEMP: 1000.0
      SA_COOLING_RATE: 0.999
      SA_MIN_PAIRS: 2
      SA_MAX_PAIRS: 2
      TOP_RESULTS_COUNT: 50
      WORKER_COUNT: 1
    depends_on:
      ramsey-mw:
        condition: service_healthy
      redis:
        condition: service_started
    logging:
      driver: loki
      options:
        loki-url: "https://loki.setminusx.cloud/loki/api/v1/push"
        mode: non-blocking
        max-buffer-size: 4m
        loki-retries: 5
        loki-batch-size: 1000
        loki-external-labels: "machine=MacBook-Pro-M4Max-1,service_name={{.Name}}"
    restart: unless-stopped
    mem_limit: 2g
    scale: 0

  ramsey-worker-rust-vds:
    image: benferenchak/ramsey-worker-rust:develop
    networks:
      - ramsey-net
    environment:
      RAMSEY_API_URL: http://ramsey-mw:8080/api/ramsey
      RAMSEY_CAMPAIGN_ID: 10
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WORKER_MODE: VARIABLE_DEPTH_SEARCH
      VDS_MAX_DEPTH: 12
      VDS_TOP_FIRST_EDGES: 80
      VDS_BRANCHING_FACTOR: 12
      VDS_WORSENING_TOLERANCE: 500
      VDS_START_DEPTH: 3
      TOP_RESULTS_COUNT: 50
      WORKER_COUNT: 1
    depends_on:
      ramsey-mw:
        condition: service_healthy
      redis:
        condition: service_started
    logging:
      driver: loki
      options:
        loki-url: "https://loki.setminusx.cloud/loki/api/v1/push"
        mode: non-blocking
        max-buffer-size: 4m
        loki-retries: 5
        loki-batch-size: 1000
        loki-external-labels: "machine=MacBook-Pro-M4Max-1,service_name={{.Name}}"
    restart: unless-stopped
    mem_limit: 2g
    scale: 0

  ramsey-worker-rust-tabu:
    image: benferenchak/ramsey-worker-rust:develop
    networks:
      - ramsey-net
    environment:
      RAMSEY_API_URL: http://ramsey-mw:8080/api/ramsey
      RAMSEY_CAMPAIGN_ID: 10
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WORKER_MODE: TABU_CLIQUE_GUIDED
      TABU_MAX_ITERATIONS: 5000
      TABU_BASE_TENURE: 30
      TABU_MAX_TENURE: 60
      TABU_RESTART_AFTER: 1000
      TABU_CANDIDATE_POOL_SIZE: 10
      TABU_DIVERSIFICATION_PAIRS: 20
      TOP_RESULTS_COUNT: 50
      WORKER_COUNT: 1
    depends_on:
      ramsey-mw:
        condition: service_healthy
      redis:
        condition: service_started
    logging:
      driver: loki
      options:
        loki-url: "https://loki.setminusx.cloud/loki/api/v1/push"
        mode: non-blocking
        max-buffer-size: 4m
        loki-retries: 5
        loki-batch-size: 1000
        loki-external-labels: "machine=MacBook-Pro-M4Max-1,service_name={{.Name}}"
    restart: unless-stopped
    mem_limit: 2g
    scale: 0

  ramsey-ui:
    image: benferenchak/ramsey-ui:develop
    networks:
      - ramsey-net
    ports:
      - "36003:8501"
    environment:
      API_BASE_URL: http://ramsey-mw:8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      ramsey-mw:
        condition: service_healthy
    logging:
      driver: loki
      options:
        loki-url: "https://loki.setminusx.cloud/loki/api/v1/push"
        mode: non-blocking
        max-buffer-size: 4m
        loki-retries: 5
        loki-batch-size: 1000
        loki-external-labels: "machine=MacBook-Pro-M4Max-1,service_name={{.Name}}"
    restart: unless-stopped
    mem_limit: 2g
    scale: 1

networks:
  ramsey-net:
    external: true

volumes:
  dragonfly-data: