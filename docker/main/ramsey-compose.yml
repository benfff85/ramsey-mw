name: ramsey

services:

  redis:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    command: dragonfly --maxmemory 7gb --snapshot_cron "*/5 * * * *" --dbfilename dump --dir /data
    networks:
      - ramsey-net
    ports:
      - "36002:6379"
    volumes:
      - dragonfly-data:/data
    mem_limit: 8g
    scale: 1
    restart: unless-stopped
    logging:
      driver: loki
      options:
        loki-url: "https://loki.setminusx.cloud/loki/api/v1/push"
        mode: non-blocking
        max-buffer-size: 4m
        loki-retries: 5
        loki-batch-size: 1000
        loki-external-labels: "machine=MacBook-Pro-M4Max-1,service_name={{.Name}}"

  ramsey-mw:
    image: benferenchak/ramsey-mw:develop
    networks:
      - ramsey-net
    ports:
      - "36000:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_USER: ramsey-user-dev
      DB_PASS: ${MYSQL_PASSWORD}
      JDBC_BATCH_SIZE: 5000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOGGING_LEVEL_ROOT: INFO
    depends_on:
      - redis
    logging:
      driver: loki
      options:
        loki-url: "https://loki.setminusx.cloud/loki/api/v1/push"
        mode: non-blocking
        max-buffer-size: 4m
        loki-retries: 5
        loki-batch-size: 1000
        loki-external-labels: "machine=MacBook-Pro-M4Max-1,service_name={{.Name}}"
    restart: unless-stopped
    mem_limit: 8g
    scale: 1

  ramsey-queue-manager:
    image: benferenchak/ramsey-queue-manager:develop
    networks:
      - ramsey-net
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # Fleet abstraction: single campaign-agnostic QM — no RAMSEY_CAMPAIGN_ID.
      # It manages progression for EVERY campaign with an ACTIVE stage. The old
      # second QM (ramsey-queue-manager-mseed) is retired.
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WORK_UNIT_ANALYSIS_TYPE: TARGETED
      WORK_ENUMERATION_STRATEGY: "DUAL_EDGE_CARDINALITY_WITH_SINGLES"  # singles census (majority color) + counter-based pair sweep
      TOP_RESULTS_COUNT: 50
      STAGE_ADOPT_SETTLE_MS: 100      # pub/sub-armed settle window; 0 = pure polling
      EXHAUSTION_DELAY_MS: 15000
      CYCLE_PREVENTION_GRAPH_LOOKBACK_COUNT: 5000
      STAGE_PROGRESSION_FREQUENCY_MS: 1000
      IMMEDIATELY_PROGRESS_STAGE_ON_IMPROVEMENT: "true"
      # Phase 2 perturbation (ILS kick): when the current basin has gone this many
      # stages without beating its OWN floor, restart from a kick of the campaign's
      # incumbent-best graph. The clock runs from the basin floor, not from the kick,
      # so a descent still finding new minima is never cut off (the old fixed
      # stages-since-kick wall killed kicks 18/19/20 mid-free-fall).
      PERTURBATION_ENABLED: "true"
      PERTURBATION_BASIN_STALE_STAGES: 100
      PERTURBATION_EDGE_PAIRS: 60          # base kick; geometric escalation doubles: 60,120,240,480,960,1920
      PERTURBATION_ESCALATION_CAP: 32      # max multiplier (x32) -> 6 steps
      PERTURBATION_CHECK_FREQUENCY_MS: 60000
      LOGGING_LEVEL_ROOT: INFO
    depends_on:
      - ramsey-mw
      - redis
    logging:
      driver: loki
      options:
        loki-url: "https://loki.setminusx.cloud/loki/api/v1/push"
        mode: non-blocking
        max-buffer-size: 4m
        loki-retries: 5
        loki-batch-size: 1000
        loki-external-labels: "machine=MacBook-Pro-M4Max-1,service_name={{.Name}}"
    restart: unless-stopped
    mem_limit: 2g
    scale: 1

  ramsey-worker-rust:
    image: benferenchak/ramsey-worker-rust:develop
    networks:
      - ramsey-net
    environment:
      RAMSEY_API_URL: http://ramsey-mw:8080/api/ramsey
      RAMSEY_FLEET: m4-max  # fleet abstraction: target set in the DB `fleet` table (repoint via PUT /fleets/m4-max, no redeploy)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Raised from 2500 with the hoisted kernel: a unit now costs ~0.26us, so 2500 units was
      # ~0.6ms of work behind a ~20ms fixed cycle cost (the per-cycle fleet active-stage HTTP
      # call), leaving the fleet 97% idle on overhead. 50k units is ~13ms of work per cycle,
      # and still bounds how long a worker can go without noticing a stage change.
      WORK_UNIT_FETCH_COUNT: 250000
      WORK_UNIT_PUBLISH_COUNT: 10000
      WORK_UNIT_POLL_FREQ: 1000
      PUBLISH_RESULTS: "false"
      TOP_RESULTS_COUNT: 50
      WORKER_COUNT: 1
    depends_on:
      ramsey-mw:
        condition: service_healthy
      redis:
        condition: service_started
    logging:
      driver: loki
      options:
        loki-url: "https://loki.setminusx.cloud/loki/api/v1/push"
        mode: non-blocking
        max-buffer-size: 4m
        loki-retries: 5
        loki-batch-size: 1000
        loki-external-labels: "machine=MacBook-Pro-M4Max-1,service_name={{.Name}}"
    restart: unless-stopped
    mem_limit: 2g
    scale: 14

  ramsey-worker-rust-sa:
    image: benferenchak/ramsey-worker-rust:develop
    networks:
      - ramsey-net
    environment:
      RAMSEY_API_URL: http://ramsey-mw:8080/api/ramsey
      RAMSEY_CAMPAIGN_ID: 10
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WORKER_MODE: SIMULATED_ANNEALING
      SA_MAX_ITERATIONS: 15000
      SA_INITIAL_TEMP: 1000.0
      SA_COOLING_RATE: 0.999
      SA_MIN_PAIRS: 2
      SA_MAX_PAIRS: 2
      TOP_RESULTS_COUNT: 50
      WORKER_COUNT: 1
    depends_on:
      ramsey-mw:
        condition: service_healthy
      redis:
        condition: service_started
    logging:
      driver: loki
      options:
        loki-url: "https://loki.setminusx.cloud/loki/api/v1/push"
        mode: non-blocking
        max-buffer-size: 4m
        loki-retries: 5
        loki-batch-size: 1000
        loki-external-labels: "machine=MacBook-Pro-M4Max-1,service_name={{.Name}}"
    restart: unless-stopped
    mem_limit: 2g
    scale: 0

  ramsey-worker-rust-vds:
    image: benferenchak/ramsey-worker-rust:develop
    networks:
      - ramsey-net
    environment:
      RAMSEY_API_URL: http://ramsey-mw:8080/api/ramsey
      RAMSEY_CAMPAIGN_ID: 10
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WORKER_MODE: VARIABLE_DEPTH_SEARCH
      VDS_MAX_DEPTH: 12
      VDS_TOP_FIRST_EDGES: 80
      VDS_BRANCHING_FACTOR: 12
      VDS_WORSENING_TOLERANCE: 500
      VDS_START_DEPTH: 3
      TOP_RESULTS_COUNT: 50
      WORKER_COUNT: 1
    depends_on:
      ramsey-mw:
        condition: service_healthy
      redis:
        condition: service_started
    logging:
      driver: loki
      options:
        loki-url: "https://loki.setminusx.cloud/loki/api/v1/push"
        mode: non-blocking
        max-buffer-size: 4m
        loki-retries: 5
        loki-batch-size: 1000
        loki-external-labels: "machine=MacBook-Pro-M4Max-1,service_name={{.Name}}"
    restart: unless-stopped
    mem_limit: 2g
    scale: 0

  ramsey-worker-rust-tabu:
    image: benferenchak/ramsey-worker-rust:develop
    networks:
      - ramsey-net
    environment:
      RAMSEY_API_URL: http://ramsey-mw:8080/api/ramsey
      RAMSEY_CAMPAIGN_ID: 10
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WORKER_MODE: TABU_CLIQUE_GUIDED
      TABU_MAX_ITERATIONS: 5000
      TABU_BASE_TENURE: 30
      TABU_MAX_TENURE: 60
      TABU_RESTART_AFTER: 1000
      TABU_CANDIDATE_POOL_SIZE: 10
      TABU_DIVERSIFICATION_PAIRS: 20
      TOP_RESULTS_COUNT: 50
      WORKER_COUNT: 1
    depends_on:
      ramsey-mw:
        condition: service_healthy
      redis:
        condition: service_started
    logging:
      driver: loki
      options:
        loki-url: "https://loki.setminusx.cloud/loki/api/v1/push"
        mode: non-blocking
        max-buffer-size: 4m
        loki-retries: 5
        loki-batch-size: 1000
        loki-external-labels: "machine=MacBook-Pro-M4Max-1,service_name={{.Name}}"
    restart: unless-stopped
    mem_limit: 2g
    scale: 0

  ramsey-ui:
    image: benferenchak/ramsey-ui:develop
    networks:
      - ramsey-net
    ports:
      - "36003:8501"
    environment:
      API_BASE_URL: http://ramsey-mw:8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      ramsey-mw:
        condition: service_healthy
    logging:
      driver: loki
      options:
        loki-url: "https://loki.setminusx.cloud/loki/api/v1/push"
        mode: non-blocking
        max-buffer-size: 4m
        loki-retries: 5
        loki-batch-size: 1000
        loki-external-labels: "machine=MacBook-Pro-M4Max-1,service_name={{.Name}}"
    restart: unless-stopped
    mem_limit: 2g
    scale: 1

networks:
  ramsey-net:
    external: true

volumes:
  dragonfly-data: