name: ramsey

services:

  redis:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    command: dragonfly --maxmemory 7gb --snapshot_cron "*/5 * * * *" --dbfilename dump --dir /data
    networks:
      - ramsey-net
    ports:
      - "36002:6379"
    volumes:
      - dragonfly-data:/data
    mem_limit: 8g
    scale: 1
    restart: unless-stopped
    logging:
      driver: loki
      options:
        loki-url: "https://loki.setminusx.cloud/loki/api/v1/push"
        mode: non-blocking
        max-buffer-size: 4m
        loki-retries: 5
        loki-batch-size: 1000
        loki-external-labels: "machine=MacBook-Pro-M4Max-1,service_name={{.Name}}"

  ramsey-mw:
    image: benferenchak/ramsey-mw:develop
    networks:
      - ramsey-net
    ports:
      - "36000:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_USER: ramsey-user-dev
      # Fail the deploy rather than start a middleware that cannot authenticate to MySQL. Unset,
      # this silently resolved to "" and recreated the container into a crash loop — which stops
      # the whole search, since workers get their stage from here.
      DB_PASS: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD before deploying (see database/README.md)}
      JDBC_BATCH_SIZE: 5000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOGGING_LEVEL_ROOT: INFO
      # Per-request timing logs at INFO only at/above this many ms (or on non-2xx). Workers poll
      # the fleet active-stage endpoint every cycle; logging each one was ~73 lines/sec.
      REQUEST_LOG_SLOW_MS: 250
    depends_on:
      - redis
    logging:
      driver: loki
      options:
        loki-url: "https://loki.setminusx.cloud/loki/api/v1/push"
        mode: non-blocking
        max-buffer-size: 4m
        loki-retries: 5
        loki-batch-size: 1000
        loki-external-labels: "machine=MacBook-Pro-M4Max-1,service_name={{.Name}}"
    restart: unless-stopped
    mem_limit: 8g
    scale: 1

  ramsey-queue-manager:
    image: benferenchak/ramsey-queue-manager:develop
    networks:
      - ramsey-net
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # Fleet abstraction: single campaign-agnostic QM — no RAMSEY_CAMPAIGN_ID.
      # It manages progression for EVERY campaign with an ACTIVE stage. The old
      # second QM (ramsey-queue-manager-mseed) is retired.
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WORK_UNIT_ANALYSIS_TYPE: TARGETED
      # Singles census + counter-based pair sweep, in plain edge order. The cardinality ordering
      # this replaces cost 13.5ms per stage per worker to build and existed to sweep likely
      # improvements first — which mattered when a sweep took ~233s and a stage only ever saw part
      # of its space. A sweep is now ~6s, stages routinely reach most of it, and the QM adopts the
      # best of the top-50 rather than the first found, so the order no longer changes the outcome.
      WORK_ENUMERATION_STRATEGY: "SEQUENTIAL_WITH_SINGLES"
      TOP_RESULTS_COUNT: 50
      STAGE_ADOPT_SETTLE_MS: 100      # pub/sub-armed settle window; 0 = pure polling
      # Grace period for in-flight workers once a stage's work is fully CLAIMED but not yet fully
      # reported. A full sweep now takes seconds rather than minutes, so 15s was comparable to a
      # whole stage; 3s still comfortably covers a worker finishing its current batch (~0.2s
      # hoisted, ~1s unhoisted).
      EXHAUSTION_DELAY_MS: 3000
      CYCLE_PREVENTION_GRAPH_LOOKBACK_COUNT: 5000
      STAGE_PROGRESSION_FREQUENCY_MS: 1000
      IMMEDIATELY_PROGRESS_STAGE_ON_IMPROVEMENT: "true"
      # Phase 2 perturbation (ILS kick): when the current basin has gone this many
      # stages without beating its OWN floor, restart from a kick of the campaign's
      # incumbent-best graph. The clock runs from the basin floor, not from the kick,
      # so a descent still finding new minima is never cut off (the old fixed
      # stages-since-kick wall killed kicks 18/19/20 mid-free-fall).
      PERTURBATION_ENABLED: "true"
      # Replaying campaign 10's basins, the gap between successive NEW basin minima reaches 249
      # stages near the floor — a basin goes quiet and then improves again. At 100 roughly half of
      # them would be kicked before reaching the floor they actually had; 500 clears every gap
      # observed, trading kick frequency for basin depth.
      PERTURBATION_BASIN_STALE_STAGES: 500
      PERTURBATION_EDGE_PAIRS: 60          # base kick; geometric escalation doubles: 60,120,240,480,960,1920
      PERTURBATION_ESCALATION_CAP: 32      # max multiplier (x32) -> 6 steps
      PERTURBATION_CHECK_FREQUENCY_MS: 60000
      LOGGING_LEVEL_ROOT: INFO
    depends_on:
      - ramsey-mw
      - redis
    logging:
      driver: loki
      options:
        loki-url: "https://loki.setminusx.cloud/loki/api/v1/push"
        mode: non-blocking
        max-buffer-size: 4m
        loki-retries: 5
        loki-batch-size: 1000
        loki-external-labels: "machine=MacBook-Pro-M4Max-1,service_name={{.Name}}"
    restart: unless-stopped
    mem_limit: 2g
    scale: 1

  ramsey-worker-rust:
    image: benferenchak/ramsey-worker-rust:develop
    networks:
      - ramsey-net
    environment:
      RAMSEY_API_URL: http://ramsey-mw:8080/api/ramsey
      RAMSEY_FLEET: m4-max  # fleet abstraction: target set in the DB `fleet` table (repoint via PUT /fleets/m4-max, no redeploy)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # STARTING/MINIMUM batch — a FLOOR, not a size. It must be low enough that the worker can
      # size a batch to fit INSIDE a stage: during a descent stages last ~370ms and units cost
      # ~40us, so the controller wants ~5,000 units, and a floor of 25,000 pinned batches at ~1s
      # spanning 2.7 stages — every one abandoned partway once workers started reacting to stage
      # advances. In the wall the controller grows to ~740k regardless, so a low floor costs
      # nothing there.
      # The worker retunes it each cycle from measured throughput,
      # targeting ~200ms of work per cycle (see next_fetch_size): it grows toward ~800k once the
      # hoisted path engages (~0.26us/unit, amortising the ~22ms fixed per-cycle cost of the fleet
      # active-stage call plus three Redis round trips) and falls back here while unhoisted
      # (~4us/unit — every stage's warmup, and all of a fast post-kick descent), where a small
      # batch is what keeps a worker responsive to stage changes.
      WORK_UNIT_FETCH_COUNT: 2000
      WORK_UNIT_PUBLISH_COUNT: 10000
      WORK_UNIT_POLL_FREQ: 1000
      PUBLISH_RESULTS: "false"
      # Kill switch for the hoisted pair-move evaluation. The hoisted and seeded paths compute
      # identical values, so this only ever trades cost — set false to fall back to the kernel.
      HOIST_ENABLED: "true"
      TOP_RESULTS_COUNT: 50
      WORKER_COUNT: 1
      # Per-stage and per-batch tracing. Off by default: 14 workers each narrating every stage
      # transition is ~56 lines per stage, which at the post-hoist stage rate buried the events
      # worth reading. Set true on a single worker to get that detail back for debugging.
      RAMSEY_LOG_DEBUG: "false"
    depends_on:
      ramsey-mw:
        condition: service_healthy
      redis:
        condition: service_started
    logging:
      driver: loki
      options:
        loki-url: "https://loki.setminusx.cloud/loki/api/v1/push"
        mode: non-blocking
        max-buffer-size: 4m
        loki-retries: 5
        loki-batch-size: 1000
        loki-external-labels: "machine=MacBook-Pro-M4Max-1,service_name={{.Name}}"
    restart: unless-stopped
    mem_limit: 2g
    scale: 14

  ramsey-worker-rust-sa:
    image: benferenchak/ramsey-worker-rust:develop
    networks:
      - ramsey-net
    environment:
      RAMSEY_API_URL: http://ramsey-mw:8080/api/ramsey
      RAMSEY_CAMPAIGN_ID: 10
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WORKER_MODE: SIMULATED_ANNEALING
      SA_MAX_ITERATIONS: 15000
      SA_INITIAL_TEMP: 1000.0
      SA_COOLING_RATE: 0.999
      SA_MIN_PAIRS: 2
      SA_MAX_PAIRS: 2
      TOP_RESULTS_COUNT: 50
      WORKER_COUNT: 1
    depends_on:
      ramsey-mw:
        condition: service_healthy
      redis:
        condition: service_started
    logging:
      driver: loki
      options:
        loki-url: "https://loki.setminusx.cloud/loki/api/v1/push"
        mode: non-blocking
        max-buffer-size: 4m
        loki-retries: 5
        loki-batch-size: 1000
        loki-external-labels: "machine=MacBook-Pro-M4Max-1,service_name={{.Name}}"
    restart: unless-stopped
    mem_limit: 2g
    scale: 0

  ramsey-worker-rust-vds:
    image: benferenchak/ramsey-worker-rust:develop
    networks:
      - ramsey-net
    environment:
      RAMSEY_API_URL: http://ramsey-mw:8080/api/ramsey
      RAMSEY_CAMPAIGN_ID: 10
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WORKER_MODE: VARIABLE_DEPTH_SEARCH
      VDS_MAX_DEPTH: 12
      VDS_TOP_FIRST_EDGES: 80
      VDS_BRANCHING_FACTOR: 12
      VDS_WORSENING_TOLERANCE: 500
      VDS_START_DEPTH: 3
      TOP_RESULTS_COUNT: 50
      WORKER_COUNT: 1
    depends_on:
      ramsey-mw:
        condition: service_healthy
      redis:
        condition: service_started
    logging:
      driver: loki
      options:
        loki-url: "https://loki.setminusx.cloud/loki/api/v1/push"
        mode: non-blocking
        max-buffer-size: 4m
        loki-retries: 5
        loki-batch-size: 1000
        loki-external-labels: "machine=MacBook-Pro-M4Max-1,service_name={{.Name}}"
    restart: unless-stopped
    mem_limit: 2g
    scale: 0

  ramsey-worker-rust-tabu:
    image: benferenchak/ramsey-worker-rust:develop
    networks:
      - ramsey-net
    environment:
      RAMSEY_API_URL: http://ramsey-mw:8080/api/ramsey
      RAMSEY_CAMPAIGN_ID: 10
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WORKER_MODE: TABU_CLIQUE_GUIDED
      TABU_MAX_ITERATIONS: 5000
      TABU_BASE_TENURE: 30
      TABU_MAX_TENURE: 60
      TABU_RESTART_AFTER: 1000
      TABU_CANDIDATE_POOL_SIZE: 10
      TABU_DIVERSIFICATION_PAIRS: 20
      TOP_RESULTS_COUNT: 50
      WORKER_COUNT: 1
    depends_on:
      ramsey-mw:
        condition: service_healthy
      redis:
        condition: service_started
    logging:
      driver: loki
      options:
        loki-url: "https://loki.setminusx.cloud/loki/api/v1/push"
        mode: non-blocking
        max-buffer-size: 4m
        loki-retries: 5
        loki-batch-size: 1000
        loki-external-labels: "machine=MacBook-Pro-M4Max-1,service_name={{.Name}}"
    restart: unless-stopped
    mem_limit: 2g
    scale: 0

  ramsey-ui:
    image: benferenchak/ramsey-ui:develop
    networks:
      - ramsey-net
    ports:
      - "36003:8501"
    environment:
      API_BASE_URL: http://ramsey-mw:8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      ramsey-mw:
        condition: service_healthy
    logging:
      driver: loki
      options:
        loki-url: "https://loki.setminusx.cloud/loki/api/v1/push"
        mode: non-blocking
        max-buffer-size: 4m
        loki-retries: 5
        loki-batch-size: 1000
        loki-external-labels: "machine=MacBook-Pro-M4Max-1,service_name={{.Name}}"
    restart: unless-stopped
    mem_limit: 2g
    scale: 1

networks:
  ramsey-net:
    external: true

volumes:
  dragonfly-data: