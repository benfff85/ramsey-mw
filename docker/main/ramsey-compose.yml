name: ramsey

services:

  redis:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    command: dragonfly --maxmemory 7gb --snapshot_cron "*/5 * * * *" --dbfilename dump --dir /data
    networks:
      - ramsey-net
    ports:
      - "36002:6379"
    volumes:
      - dragonfly-data:/data
    mem_limit: 8g
    scale: 1
    restart: on-failure
    logging:
      driver: loki
      options:
        loki-url: "https://loki.setminusx.cloud/loki/api/v1/push"
        mode: non-blocking
        max-buffer-size: 4m
        loki-retries: 5
        loki-batch-size: 1000
        loki-external-labels: "machine=MacBook-Pro-M4Max-1,service_name={{.Name}}"

  ramsey-mw:
    image: benferenchak/ramsey-mw:develop
    networks:
      - ramsey-net
    ports:
      - "36000:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_USER: ramsey-user-dev
      DB_PASS: ${MYSQL_PASSWORD}
      JDBC_BATCH_SIZE: 5000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOGGING_LEVEL_ROOT: INFO
    depends_on:
      - redis
    logging:
      driver: loki
      options:
        loki-url: "https://loki.setminusx.cloud/loki/api/v1/push"
        mode: non-blocking
        max-buffer-size: 4m
        loki-retries: 5
        loki-batch-size: 1000
        loki-external-labels: "machine=MacBook-Pro-M4Max-1,service_name={{.Name}}"
    restart: on-failure
    mem_limit: 8g
    scale: 1

  ramsey-queue-manager:
    image: benferenchak/ramsey-queue-manager:develop
    networks:
      - ramsey-net
    environment:
      SPRING_PROFILES_ACTIVE: dev
      RAMSEY_CAMPAIGN_ID: 2
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WORK_UNIT_ANALYSIS_TYPE: TARGETED
      WORK_ENUMERATION_STRATEGY: "DUAL_EDGE_CARDINALITY"  # Set to DUAL_EDGE_CARDINALITY for counter-based mode
      TOP_RESULTS_COUNT: 50
      EXHAUSTION_DELAY_MS: 60000
      CYCLE_PREVENTION_GRAPH_LOOKBACK_COUNT: 50
      LOGGING_LEVEL_ROOT: INFO
    depends_on:
      - ramsey-mw
      - redis
    logging:
      driver: loki
      options:
        loki-url: "https://loki.setminusx.cloud/loki/api/v1/push"
        mode: non-blocking
        max-buffer-size: 4m
        loki-retries: 5
        loki-batch-size: 1000
        loki-external-labels: "machine=MacBook-Pro-M4Max-1,service_name={{.Name}}"
    restart: on-failure
    mem_limit: 2g
    scale: 1

  ramsey-worker-rust:
    image: benferenchak/ramsey-worker-rust:develop
    networks:
      - ramsey-net
    environment:
      RAMSEY_API_URL: http://ramsey-mw:8080/api/ramsey
      RAMSEY_CAMPAIGN_ID: 2
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WORK_UNIT_FETCH_COUNT: 250000
      WORK_UNIT_PUBLISH_COUNT: 10000
      WORK_UNIT_POLL_FREQ: 5000
      PUBLISH_RESULTS: "false"
      TOP_RESULTS_COUNT: 50
      WORKER_COUNT: 1
    depends_on:
      ramsey-mw:
        condition: service_healthy
      redis:
        condition: service_started
    logging:
      driver: loki
      options:
        loki-url: "https://loki.setminusx.cloud/loki/api/v1/push"
        mode: non-blocking
        max-buffer-size: 4m
        loki-retries: 5
        loki-batch-size: 1000
        loki-external-labels: "machine=MacBook-Pro-M4Max-1,service_name={{.Name}}"
    restart: on-failure
    mem_limit: 2g
    scale: 6

  ramsey-worker-rust-sa:
    image: benferenchak/ramsey-worker-rust:develop
    networks:
      - ramsey-net
    environment:
      RAMSEY_API_URL: http://ramsey-mw:8080/api/ramsey
      RAMSEY_CAMPAIGN_ID: 2
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WORKER_MODE: SIMULATED_ANNEALING
      SA_MAX_ITERATIONS: 15000
      SA_INITIAL_TEMP: 1000.0
      SA_COOLING_RATE: 0.999
      SA_MIN_PAIRS: 2
      SA_MAX_PAIRS: 2
      TOP_RESULTS_COUNT: 50
      WORKER_COUNT: 1
    depends_on:
      ramsey-mw:
        condition: service_healthy
      redis:
        condition: service_started
    logging:
      driver: loki
      options:
        loki-url: "https://loki.setminusx.cloud/loki/api/v1/push"
        mode: non-blocking
        max-buffer-size: 4m
        loki-retries: 5
        loki-batch-size: 1000
        loki-external-labels: "machine=MacBook-Pro-M4Max-1,service_name={{.Name}}"
    restart: on-failure
    mem_limit: 2g
    scale: 0

  ramsey-worker-rust-vds:
    image: benferenchak/ramsey-worker-rust:develop
