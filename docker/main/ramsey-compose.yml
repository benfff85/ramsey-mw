name: ramsey

services:

  redis:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    command: dragonfly --maxmemory 7gb
    networks:
      - ramsey-net
    ports:
      - "36002:6379"
    mem_limit: 8g
    logging:
      driver: loki
      options:
        loki-url: https://loki.setminusx.com/loki/api/v1/push
        loki-retries: 5
        loki-batch-size: 50
        loki-external-labels: "machine=MacBook-Pro-M4Max-1,service_name={{.Name}}"

  ramsey-mw:
    image: benferenchak/ramsey-mw:develop
    networks:
      - ramsey-net
    ports:
      - "36000:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_USER: ramsey-user-dev
      DB_PASS: ${MYSQL_PASSWORD}
      JDBC_BATCH_SIZE: 5000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOGGING_LEVEL_ROOT: INFO
    depends_on:
      - redis
    logging:
      driver: loki
      options:
        loki-url: https://loki.setminusx.com/loki/api/v1/push
        loki-retries: 5
        loki-batch-size: 50
        loki-external-labels: "machine=MacBook-Pro-M4Max-1,service_name={{.Name}}"
    restart: on-failure
    mem_limit: 2g

  ramsey-queue-manager:
    image: benferenchak/ramsey-queue-manager:develop
    networks:
      - ramsey-net
    environment:
      SPRING_PROFILES_ACTIVE: dev
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WORK_UNIT_ANALYSIS_TYPE: TARGETED
      WORK_UNIT_QUEUE_DEPTH_MIN: 30000000
      WORK_UNIT_QUEUE_DEPTH_MAX: 32000000
      WORK_UNIT_QUEUE_PUBLISH_COUNT: 50000
      WORK_UNIT_QUEUE_FEEDER_FREQ: 1000
      WORK_ENUMERATION_STRATEGY: "DUAL_EDGE_CARDINALITY"  # Set to DUAL_EDGE_CARDINALITY for counter-based mode
      LOGGING_LEVEL_ROOT: INFO
    depends_on:
      - ramsey-mw
      - redis
    logging:
      driver: loki
      options:
        loki-url: https://loki.setminusx.com/loki/api/v1/push
        loki-retries: 5
        loki-batch-size: 50
        loki-external-labels: "machine=MacBook-Pro-M4Max-1,service_name={{.Name}}"
    restart: on-failure
    mem_limit: 2g

  ramsey-worker-rust:
    image: benferenchak/ramsey-worker-rust:develop
    networks:
      - ramsey-net
    environment:
      RAMSEY_API_URL: http://ramsey-mw:8080/api/ramsey
      RAMSEY_CAMPAIGN_ID: 1
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WORK_UNIT_FETCH_COUNT: 50000
      WORK_UNIT_PUBLISH_COUNT: 10000
      WORK_UNIT_POLL_FREQ: 5000
      CLIENT_PHONE_HOME_FREQ: 60000
      PUBLISH_RESULTS: "false"
    depends_on:
      ramsey-mw:
        condition: service_healthy
      redis:
        condition: service_started
    logging:
      driver: loki
      options:
        loki-url: https://loki.setminusx.com/loki/api/v1/push
        loki-retries: 5
        loki-batch-size: 50
        loki-external-labels: "machine=MacBook-Pro-M4Max-1,service_name={{.Name}}"
    restart: on-failure
    mem_limit: 2g
    scale: 14

  ramsey-ui:
    image: benferenchak/ramsey-ui:develop
    networks:
      - ramsey-net
    ports:
      - "36003:8501"
    environment:
      API_BASE_URL: http://ramsey-mw:8080
      RAMSEY_CAMPAIGN_ID: 1
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      ramsey-mw:
        condition: service_healthy
    logging:
      driver: loki
      options:
        loki-url: https://loki.setminusx.com/loki/api/v1/push
        loki-retries: 5
        loki-batch-size: 50
        loki-external-labels: "machine=MacBook-Pro-M4Max-1,service_name={{.Name}}"
    restart: on-failure
    mem_limit: 2g

networks:
  ramsey-net:
    external: true