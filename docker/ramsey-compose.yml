services:
  ramsey-mw:
    image: benferenchak/ramsey-mw:develop
    container_name: ramsey-mw
    networks:
      - ramsey-net
    ports:
      - "4040:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_USER: ramsey-user-dev
      DB_PASS: <password>
    logging:
      driver: json-file
      options:
        max-size: "10m"
    restart: on-failure

networks:
  ramsey-net:
    external: true

