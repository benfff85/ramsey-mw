logging:
  level:
    root: INFO
  pattern:
    dateformat: yyyy-MM-dd'T'HH:mm:ss.SSSXXX
    console: "[%d{${logging.pattern.dateformat}}] %clr([%X{traceId:-},%X{spanId:-}]){blue} %clr(%5p){green} %clr(${PID:-}){magenta} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"

ramsey:
  work-unit:
    page-size:
      default: 5
      max: 500
  request-log:
    # Per-request timing logs at INFO only when a request is at least this slow (or non-2xx).
    # Every worker polls the fleet active-stage endpoint each cycle, so logging every request
    # scaled with fleet speed rather than with anything worth reading.
    slow-threshold-ms: ${REQUEST_LOG_SLOW_MS:250}

spring:
  datasource:
    hikari:
      # Pool connections start with autocommit OFF, and Hibernate is told so below. Without that,
      # Spring turned autocommit off and back on around every transaction: two SET autocommit
      # round trips each (~101M a week). These two settings must stay together. A pool at
      # autocommit=true with Hibernate assuming false would autocommit every statement, so
      # multi-statement transactions would stop being atomic. Safe here because every mw DB access
      # is a Spring Data repository call, which runs in a transaction (no JdbcTemplate, no
      # EntityManager). Verified write-by-write against a scratch stack, 2026-10-08.
      auto-commit: false
  jpa:
    properties:
      hibernate:
        connection:
          provider_disables_autocommit: true
        jdbc:
          batch_size: ${JDBC_BATCH_SIZE:5000}
        order_inserts: true
        order_updates: true

server:
  forward-headers-strategy: framework # Needed for api docs behind reverse proxy

management:
  endpoint:
    health:
      show-details: always
