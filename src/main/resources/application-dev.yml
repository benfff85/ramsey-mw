spring:
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:none} # Creates tables [none, create]
    defer-datasource-initialization: true
  sql:
    init:
      mode: ${SQL_INIT_MODE:never} # Runs data.sql for inserts [never, always]
  datasource:
    # readOnlyPropagatesToServer=false: Spring Data's read methods run @Transactional(readOnly=true),
    # and the driver sent SET SESSION TRANSACTION READ ONLY and then READ WRITE around each one
    # (~89M a week). Read-only is still enforced by Hibernate; MySQL only loses the hint.
    url: jdbc:mysql://ramsey-db-mysql:3306/ramsey-dev?autoReconnect=true&useSSL=false&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true&useLocalSessionState=true&cacheServerConfiguration=true&maintainTimeStats=false&readOnlyPropagatesToServer=false
    username: ${DB_USER}
    password: ${DB_PASS}
    hikari:
      # Max_used_connections reached 21 against a ceiling of 20, i.e. the pool has saturated and
      # queued at least once. Server max_connections is 151, so there is ample room.
      maximum-pool-size: 30
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1800000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

