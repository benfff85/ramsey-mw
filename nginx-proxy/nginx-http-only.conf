# HTTP-only config for initial certificate issuance
# After obtaining certs, switch back to nginx.conf

events {
    worker_connections 1024;
}

http {
    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Proxy settings
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Upstream definitions
    upstream ramsey_ui {
        server host.docker.internal:36003;
    }

    upstream ramsey_mw {
        server host.docker.internal:36000;
    }

    upstream portainer {
        server host.docker.internal:9000;
    }

    upstream openwebui {
        server host.docker.internal:11800;
    }

    upstream jupyter {
        server host.docker.internal:8888;
    }

    # HTTP server for ACME challenges
    server {
        listen 80;
        server_name www.setminusx.cloud ramsey-ui.setminusx.cloud;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            proxy_pass http://ramsey_ui;
        }
    }

    server {
        listen 80;
        server_name ramsey-mw.setminusx.cloud;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            proxy_pass http://ramsey_mw;
        }
    }

    server {
        listen 80;
        server_name portainer.setminusx.cloud;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            proxy_pass http://portainer;
        }
    }

    server {
        listen 80;
        server_name openwebui.setminusx.cloud;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            proxy_pass http://openwebui;
        }
    }

    server {
        listen 80;
        server_name jupyter.setminusx.cloud;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            proxy_pass http://jupyter;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # Default server
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }
}
