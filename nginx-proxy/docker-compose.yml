version: '3.9'

services:
  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /Users/benferenchak/IdeaProjects/ramsey/ramsey-mw/nginx-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - /Users/benferenchak/IdeaProjects/ramsey/ramsey-mw/nginx-proxy/ssl:/etc/nginx/ssl:ro
      - /Users/benferenchak/IdeaProjects/ramsey/ramsey-mw/nginx-proxy/certbot/www:/var/www/certbot:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - /Users/benferenchak/IdeaProjects/ramsey/ramsey-mw/nginx-proxy/ssl:/etc/letsencrypt
      - /Users/benferenchak/IdeaProjects/ramsey/ramsey-mw/nginx-proxy/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
